"Pick a line first. As in OMSI, the start time and date then say where in the tour the bus is: the trip under way, or the next to leave.":
  ru: "Сначала выберите линию. Как в OMSI, время и дата старта определяют, где в выходе находится автобус: текущий рейс или следующий."
  de: "Wähle zuerst eine Linie. Wie in OMSI bestimmen Startzeit und Datum, wo im Umlauf der Bus ist: die laufende Fahrt oder die nächste."
  fr: "Choisissez d'abord une ligne. Comme dans OMSI, l'heure et la date de départ indiquent où en est le bus dans son service : le trajet en cours ou le suivant."
  cn: "请先选择线路。和 OMSI 一样，开始时间和日期决定公交车在轮次中的位置：正在进行的行程，或即将发车的下一班。"
