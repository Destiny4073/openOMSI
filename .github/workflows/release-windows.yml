# Builds openOMSI for Windows, only when started by hand (the Actions tab's "Run
# workflow"); the zip shows up under the run's Artifacts, nothing is published.
name: Release Windows

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: echo "version=$(sh scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - run: echo "### openOMSI ${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      OPENOMSI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: cmd
        run: scripts\build-windows.cmd
      - name: Package
        shell: pwsh
        run: |
          $name = "openOMSI-$env:OPENOMSI_VERSION-windows-x64"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item README.md, LICENSE dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath "out/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.zip
